<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mavericks</title>
  <meta name="description" content="Record badminton doubles results, online or offline.">
  <meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mavericks">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Mavericks games</h1>
    <button id="status" class="status" type="button" aria-live="polite"></button>
    <button id="open-settings" class="icon-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>

  <main>
    <label class="date-row">
      <span id="date-label" class="date-label"></span>
      <span id="date-today" class="date-tag">Today</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      <input id="date" type="date" aria-label="Date of play">
    </label>

    <p id="past-note" class="past-note" hidden>Past days are view-only. To change this day, edit the sheet.</p>

    <form id="form" novalidate autocomplete="off">
      <div id="edit-banner" class="edit-banner" hidden>
        <span id="edit-title"></span>
        <button id="delete" class="link danger" type="button">Delete game</button>
      </div>

      <section class="team team-win" aria-label="Winners">
        <h2>Winners</h2>
        <div class="team-body">
          <div class="slots">
            <button class="slot" type="button" data-slot="winner1"></button>
            <button class="slot" type="button" data-slot="winner2"></button>
          </div>
          <div class="score">
            <input id="winnerScore" class="score-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="&ndash;" aria-label="Winner score, 0 to 21">
          </div>
        </div>
      </section>

      <section class="team team-lose" aria-label="Losers">
        <h2>Losers</h2>
        <div class="team-body">
          <div class="slots">
            <button class="slot" type="button" data-slot="loser1"></button>
            <button class="slot" type="button" data-slot="loser2"></button>
          </div>
          <div class="score">
            <input id="loserScore" class="score-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="&ndash;" aria-label="Loser score, 0 to 21">
          </div>
        </div>
      </section>


      <p id="form-error" class="form-error" role="alert" hidden></p>

      <div class="actions">
        <button id="cancel-edit" class="btn btn-quiet" type="button" hidden>Cancel</button>
        <button id="save" class="btn btn-primary" type="submit">Save game</button>
      </div>
    </form>

    <section id="potd" class="potd" aria-label="Player of the day" hidden>
      <span class="potd-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5v1.5A3.5 3.5 0 0 0 8.5 11M16 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5"/><path d="M12 13v4M8.5 20h7M9.5 17h5v3h-5z"/></svg>
      </span>
      <div class="potd-body">
        <p id="potd-label" class="potd-label"></p>
        <ul id="potd-list" class="potd-list"></ul>
        <p id="potd-note" class="potd-note" hidden>Updates once this phone's games upload.</p>
      </div>
    </section>

    <section class="games" aria-labelledby="games-title">
      <h2 id="games-title"></h2>
      <p id="games-empty" class="games-empty">No games recorded for this day yet.</p>
      <ol id="games-list" class="games-list"></ol>
    </section>
  </main>

  <dialog id="picker" class="sheet">
    <div class="sheet-head">
      <h2 id="picker-title" tabindex="-1" autofocus></h2>
      <button id="picker-clear" class="link danger" type="button" hidden>Clear all</button>
      <button id="picker-close" class="link" type="button">Done</button>
    </div>
    <p id="picker-hint" class="picker-hint"></p>
    <div id="picker-slots" class="slot-strip"></div>
    <input id="picker-search" class="field" type="text" placeholder="Search or add a player" aria-label="Search or add a player" autocapitalize="words" enterkeyhint="done">
    <div id="picker-grid" class="chips"></div>
    <p id="picker-empty" class="sheet-hint" hidden>No players yet. Connect in Settings to load your list, or type a name above.</p>
  </dialog>

  <dialog id="settings" class="sheet">
    <div class="sheet-head">
      <h2 id="settings-title" tabindex="-1" autofocus>Settings</h2>
      <button id="settings-close" class="link" type="button">Close</button>
    </div>
    <form id="settings-form" novalidate autocomplete="off">
      <label class="field-label" for="set-url">Apps Script web app URL</label>
      <input id="set-url" class="field" type="url" inputmode="url" spellcheck="false" placeholder="https://script.google.com/macros/s/&hellip;/exec">
      <label class="field-label" for="set-pass">Passcode</label>
      <input id="set-pass" class="field" type="password" spellcheck="false" placeholder="The PASSCODE you set in the script">
      <p id="settings-msg" class="settings-msg" role="status" hidden></p>
      <button class="btn btn-primary" type="submit">Save and test connection</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
